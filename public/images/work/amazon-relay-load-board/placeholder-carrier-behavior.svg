="30" rx="4" fill="#fff" stroke="#c9a08a" stroke-width="1" /><text x="88" y="702" font-family="'Roboto Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#4c5a43" text-anchor="start" >03</text><text x="124" y="702" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1a3300" text-anchor="start" >Several browser tabs</text><text x="124" y="734" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#3b4734" text-anchor="start" >Some carriers kept several tabs open to hold</text><text x="124" y="756" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#3b4734" text-anchor="start" >searches and loads in view.</text><rect x="615" y="527" width="520" height="300" rx="14" fill="rgba(0,0,0,0.07)" /><rect x="610" y="520" width="520" height="300" rx="14" fill="#fff" stroke="#cbd3c6" stroke-width="1" /><rect x="610" y="520" width="520" height="140" rx="14" fill="#fff3a3" /><rect x="610" y="646" width="520" height="14" rx="0" fill="#fff3a3" /><rect x="650" y="550" width="260" height="12" rx="6" fill="#fff" /><rect x="930" y="550" width="60" height="12" rx="6" fill="#e8d96a" /><rect x="650" y="570" width="260" height="12" rx="6" fill="#fff" /><rect x="930" y="570" width="60" height="12" rx="6" fill="#e8d96a" /><rect x="650" y="590" width="260" height="12" rx="6" fill="#fff" /><rect x="930" y="590" width="60" height="12" rx="6" fill="#e8d96a" /><rect x="650" y="610" width="260" height="12" rx="6" fill="#fff" /><rect x="930" y="610" width="60" height="12" rx="6" fill="#e8d96a" /><text x="1010" y="604" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#6b5d00" text-anchor="start" >22</text><text x="638" y="702" font-family="'Roboto Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#4c5a43" text-anchor="start" >04</text><text x="674" y="702" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1a3300" text-anchor="start" >Default results needed filtering</text><text x="674" y="734" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#3b4734" text-anchor="start" >Generic landing results had to be filtered</text><text x="674" y="756" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#3b4734" text-anchor="start" >before they were useful.</text></svg>