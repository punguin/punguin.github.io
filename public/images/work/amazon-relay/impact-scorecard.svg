<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a3300"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#cfd6cc"/></pattern></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#eef1ef" /><rect x="0" y="0" width="1600" height="900" rx="0" fill="url(#grid)" /><text x="60" y="80" font-family="'Roboto Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#4c5a43" text-anchor="start" letter-spacing="1.2">AFTER LAUNCH</text><text x="60" y="120" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1a3300" text-anchor="start" >Same pace of work, fewer calls for help</text><rect x="65" y="187" width="720" height="240" rx="16" fill="rgba(0,0,0,0.07)" /><rect x="60" y="180" width="720" height="240" rx="16" fill="#c9ecef" stroke="#1a3300" stroke-width="1.5" /><text x="96" y="290" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="#1a3300" text-anchor="start" >30% → 17%</text><text x="96" y="336" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#1a3300" text-anchor="start" >of loads needing a support call</text><text x="96" y="376" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#3b4734" text-anchor="start" >Reduction in support calls</text><rect x="815" y="187" width="720" height="240" rx="16" fill="rgba(0,0,0,0.07)" /><rect x="810" y="180" width="720" height="240" rx="16" fill="#d5f2e3" stroke="#1a3300" stroke-width="1.5" /><text x="846" y="290" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="#1a3300" text-anchor="start" >Steady</text><text x="846" y="336" font-fam